<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="BISINDO Sign Language Translator">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BISINDO Translator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sign Language Translator - BISINDO</title>
  <link rel="manifest" href="manifest.json">

  <!-- Local & Offline Resilience for Flutter CanvasKit -->
  <script>
    window._flutter = window._flutter || {};
    // Ensure CanvasKit loads locally from localhost instead of failing on gstatic when offline
    Object.defineProperty(window._flutter, 'buildConfig', {
      configurable: true,
      enumerable: true,
      get: function() {
        return this._bc;
      },
      set: function(val) {
        if (val) {
          val.useLocalCanvasKit = true;
        }
        this._bc = val;
      }
    });
  </script>

  <!-- MediaPipe Hand Landmarker Web Integration (Offline-Ready & Dynamic Fallback) -->
  <script>
    let FilesetResolver = null;
    let HandLandmarker = null;
    let handLandmarker = null;
    let isInitializing = false;
    let initError = null;
    let lastVideoTime = -1;
    let lastTimestampMs = 0;

    async function initMediaPipe() {
      if (handLandmarker || isInitializing) return;
      isInitializing = true;
      try {
        let visionModule;
        // 1. Try local bundled MediaPipe tasks-vision
        try {
          visionModule = await import("./mediapipe/tasks-vision.js");
        } catch (_) {
          // 2. Fallback to jsdelivr CDN if local file fails
          try {
            visionModule = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm");
          } catch (cdnErr) {
            console.warn("[BISINDO MediaPipe] JSDelivr CDN unreachable (DNS/Offline). Simulation mode remains active.", cdnErr);
            initError = "Offline: MediaPipe offline. Mode simulasi gestur tetap aktif.";
            isInitializing = false;
            return;
          }
        }

        FilesetResolver = visionModule.FilesetResolver;
        HandLandmarker = visionModule.HandLandmarker;

        let wasmPath = "./mediapipe";
        let modelPath = "./mediapipe/hand_landmarker.task";

        let vision;
        try {
          vision = await FilesetResolver.forVisionTasks(wasmPath);
        } catch (_) {
          wasmPath = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm";
          modelPath = "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task";
          vision = await FilesetResolver.forVisionTasks(wasmPath);
        }

        const options = {
          baseOptions: {
            modelAssetPath: modelPath,
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 2,
          minHandDetectionConfidence: 0.40,
          minHandPresenceConfidence: 0.40,
          minTrackingConfidence: 0.40
        };

        try {
          handLandmarker = await HandLandmarker.createFromOptions(vision, options);
        } catch (_) {
          // Fallback to CPU delegate if WebGL GPU delegate is restricted
          options.baseOptions.delegate = "CPU";
          handLandmarker = await HandLandmarker.createFromOptions(vision, options);
        }
        console.log("[BISINDO MediaPipe] HandLandmarker initialized successfully (local & offline ready).");
      } catch (err) {
        initError = String(err);
        console.warn("[BISINDO MediaPipe] HandLandmarker initialization warning:", err);
      } finally {
        isInitializing = false;
      }
    }

    function findActiveVideo(root = document) {
      const videos = root.querySelectorAll ? root.querySelectorAll("video") : [];
      for (const v of videos) {
        if (v.readyState >= 2 && v.videoWidth > 0 && v.videoHeight > 0) {
          return v;
        }
      }
      const allElements = root.querySelectorAll ? root.querySelectorAll("*") : [];
      for (const el of allElements) {
        if (el.shadowRoot) {
          const found = findActiveVideo(el.shadowRoot);
          if (found) return found;
        }
      }
      return null;
    }

    function isVideoMirrored(video) {
      const inlineTransform = (video.style && video.style.transform) || "";
      if (inlineTransform.includes("scaleX(-1)")) return true;
      try {
        const computed = window.getComputedStyle(video).transform;
        if (computed && computed.startsWith("matrix(")) {
          const parts = computed.slice(7, -1).split(",");
          const scaleX = parseFloat(parts[0]);
          if (scaleX < 0) return true;
        }
      } catch (_) {}
      return false;
    }

    window.bisindoInitMediaPipe = function () {
      initMediaPipe();
    };

    window.bisindoDetectFrameJson = function () {
      if (!handLandmarker) {
        initMediaPipe();
        return JSON.stringify({
          ready: false,
          initializing: isInitializing,
          error: initError,
          videoFound: false,
          hands: []
        });
      }

      const video = findActiveVideo();
      if (!video) {
        return JSON.stringify({
          ready: true,
          videoFound: false,
          hands: []
        });
      }

      try {
        let nowMs = Math.floor(performance.now());
        if (nowMs <= lastTimestampMs) {
          nowMs = lastTimestampMs + 1;
        }
        lastTimestampMs = nowMs;

        const result = handLandmarker.detectForVideo(video, nowMs);
        const mirrored = isVideoMirrored(video);

        // Compute object-fit: cover mapping from intrinsic video size to rendered container size
        const vw = video.videoWidth || 640;
        const vh = video.videoHeight || 480;
        const cw = video.clientWidth || vw;
        const ch = video.clientHeight || vh;

        const scale = Math.max(cw / vw, ch / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        const offsetX = (dw - cw) / 2.0;
        const offsetY = (dh - ch) / 2.0;

        const hands = [];
        if (result && result.landmarks) {
          for (let i = 0; i < result.landmarks.length; i++) {
            const rawLandmarks = result.landmarks[i];
            const handednessEntry =
              result.handednesses &&
              result.handednesses[i] &&
              result.handednesses[i][0]
                ? result.handednesses[i][0]
                : null;

            const handedness = handednessEntry
              ? handednessEntry.categoryName || "Right"
              : "Right";
            const confidence = handednessEntry
              ? handednessEntry.score || 0.95
              : 0.95;

            const mappedLandmarks = rawLandmarks.map((lm) => {
              const rawX = mirrored ? 1.0 - lm.x : lm.x;
              const screenX = (rawX * dw - offsetX) / cw;
              const screenY = (lm.y * dh - offsetY) / ch;
              return {
                x: Math.max(0.0, Math.min(1.0, screenX)),
                y: Math.max(0.0, Math.min(1.0, screenY)),
                z: lm.z || 0.0
              };
            });

            hands.push({
              handedness: handedness,
              confidence: confidence,
              landmarks: mappedLandmarks
            });
          }
        }

        return JSON.stringify({
          ready: true,
          videoFound: true,
          hands: hands
        });
      } catch (e) {
        return JSON.stringify({
          ready: true,
          videoFound: true,
          error: String(e),
          hands: []
        });
      }
    };

    // Start preloading MediaPipe HandLandmarker immediately
    initMediaPipe();
  </script>
</head>
<body>
  <div id="flutter-loading" style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; z-index: 999999;">
    <div style="width: 44px; height: 44px; border: 4px solid #e2e8f0; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 0.9s linear infinite;"></div>
    <div style="margin-top: 16px; font-size: 15px; font-weight: 600; color: #1e293b;">Memuat Penerjemah BISINDO...</div>
    <div style="margin-top: 6px; font-size: 12px; color: #64748b;">Menyiapkan CanvasKit & AI On-Device</div>
    <div id="flutter-error" style="display: none; margin-top: 20px; text-align: center;">
      <p style="color: #dc2626; font-size: 13px; max-width: 300px; margin: 0 auto; line-height: 1.4;">Jaringan lambat atau offline. Klik tombol di bawah untuk memuat ulang.</p>
      <button onclick="window.location.reload()" style="margin-top: 12px; padding: 8px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 6px rgba(37,99,235,0.3);">Muat Ulang</button>
    </div>
  </div>
  <style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const el = document.getElementById('flutter-loading');
      if (el) el.remove();
    });
    setTimeout(function() {
      const err = document.getElementById('flutter-error');
      if (err) err.style.display = 'block';
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
