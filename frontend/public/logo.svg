<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bisindo-grad-primary" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="bisindo-grad-accent" x1="36" y1="8" x2="12" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="bisindo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Housing Squircle -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#18181B" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />

  <!-- Vertical Kinematic Anchor Spine -->
  <rect x="11" y="9.5" width="4" height="21" rx="2" fill="url(#bisindo-grad-primary)" />

  <!-- Upper Gesture Arc -->
  <path d="M13.5 11.5 H21 C25.5 11.5 28.5 14 28.5 17.5 C28.5 21 25.5 22.5 21 22.5 H13.5" stroke="url(#bisindo-grad-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Lower Gesture Arc -->
  <path d="M13.5 22.5 H22 C27 22.5 30 25 30 28.5 C30 32 27 34 22 34 H13.5" stroke="url(#bisindo-grad-accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Vision Landmark Node -->
  <circle cx="21" cy="22.5" r="1.8" fill="#FFFFFF" filter="url(#bisindo-glow)" />

  <!-- Top Gesture Guide Node -->
  <circle cx="21" cy="11.5" r="1.2" fill="#C4B5FD" />
</svg>

